name: crawl-news

on:
  schedule:
    - cron: '0 */6 * * *'   # 每天 0/6/12/18 点
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取新闻并推送
        run: python crawl.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
